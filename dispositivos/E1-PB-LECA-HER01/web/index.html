<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA - Panel LabECA</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Paho MQTT WebSockets Client -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">🛠️ AURA Control de Stock - LabECA</span>
      <span id="mqtt-status" class="badge bg-warning text-dark">Conectando a MQTT...</span>
    </div>
  </nav>

  <div class="container">
    <!-- Tarjetas de Resumen -->
    <div class="row mb-4">
      <div class="col-md-4">
        <div class="card text-white bg-primary mb-3 shadow-sm">
          <div class="card-body">
            <h6 class="card-title">Herramientas en LabECA</h6>
            <h2 id="total-stock" class="display-4 fw-bold">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-white bg-success mb-3 shadow-sm">
          <div class="card-body">
            <h6 class="card-title">Último Evento Registraro</h6>
            <h4 id="last-event-type" class="fw-normal">Sin registros</h4>
            <small id="last-event-uid" class="text-white-50"></small>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card text-white bg-info mb-3 shadow-sm">
          <div class="card-body">
            <h6 class="card-title">Estado del Dispositivo</h6>
            <h4 id="node-status" class="fw-normal">Desconocido</h4>
            <small id="node-heap" class="text-white-50">Heap: N/A</small>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabla de Historial de Movimientos -->
    <div class="card shadow-sm">
      <div class="card-header bg-white font-weight-bold d-flex justify-content-between align-items-center">
        <span>📋 Historial de Movimientos en Tiempo Real</span>
        <button class="btn btn-sm btn-outline-secondary" onclick="limpiarTabla()">Limpiar Historial</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-striped mb-0">
            <thead class="table-dark">
              <tr>
                <th>Hora / Fecha</th>
                <th>Activo / Tag UID</th>
                <th>Movimiento</th>
                <th>Ubicación</th>
              </tr>
            </thead>
            <tbody id="movements-table-body">
              <tr id="empty-row">
                <td colspan="4" class="text-center text-muted py-4">Esperando eventos del lector...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
